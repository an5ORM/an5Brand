<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-indigo" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Card glow filters -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>

    <filter id="box-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Glow circles -->
  <circle cx="240" cy="180" r="400" fill="url(#glow-cyan)"/>
  <circle cx="960" cy="450" r="450" fill="url(#glow-indigo)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>

    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Main Container Card -->
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" filter="url(#box-shadow)"/>

  <!-- Logo and Branding -->
  <g transform="translate(105, 91)">
    <!-- AN5 Badge: generated from the brand tokens, do not hand-edit -->
{{BADGE}}

    <!-- Title -->
    <text x="110" y="42" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="url(#text-grad)">ORM</text>
    <text x="240" y="40" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#38bdf8" letter-spacing="1.5">DOCUMENTATION</text>
  </g>

  <!-- Tagline / Headline -->
  <text x="110" y="245" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Modern, Type-Safe ORM for Every Platform
  </text>

  <text x="110" y="295" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Single schema definition with native client generation across 5 major languages.
  </text>

  <!-- Language Pills -->
  <g transform="translate(110, 345)">
    <!-- TypeScript -->
    <rect x="0" y="0" width="140" height="42" rx="8" fill="rgba(49, 120, 198, 0.15)" stroke="rgba(49, 120, 198, 0.4)" stroke-width="1.2"/>
    <text x="70" y="26" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#60a5fa" text-anchor="middle">TypeScript</text>

    <!-- Python -->
    <rect x="155" y="0" width="120" height="42" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    <text x="215" y="26" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#38bdf8" text-anchor="middle">Python</text>

    <!-- .NET C# -->
    <rect x="290" y="0" width="120" height="42" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2"/>
    <text x="350" y="26" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#c084fc" text-anchor="middle">.NET C#</text>

    <!-- Go -->
    <rect x="425" y="0" width="100" height="42" rx="8" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1.2"/>
    <text x="475" y="26" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#4ade80" text-anchor="middle">Golang</text>

    <!-- Rust -->
    <rect x="540" y="0" width="100" height="42" rx="8" fill="rgba(249, 115, 22, 0.12)" stroke="rgba(249, 115, 22, 0.35)" stroke-width="1.2"/>
    <text x="590" y="26" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#fb923c" text-anchor="middle">Rust</text>
  </g>

  <!-- Database & Feature Badges -->
  <g transform="translate(110, 420)">
    <text x="0" y="26" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1">ADAPTERS:</text>
    <text x="95" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#38bdf8">SQL Server · PostgreSQL · MySQL · SQLite · Google Sheets · NBase</text>
  </g>

  <!-- Footer Info -->
  <g transform="translate(110, 495)">
    <!-- GitHub Link / Domain -->
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="#94a3b8">an5orm.github.io</text>

    <!-- Features -->
    <text x="970" y="20" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#38bdf8" text-anchor="end">
      Vector Search · AI Agent Tools · 100% Type-Safe
    </text>
  </g>
</svg>
